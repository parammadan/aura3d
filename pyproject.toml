[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aura3d"
version = "0.0.1"
description = "Uncertainty-aware perception and predictive planning for simulated industrial manipulation"
requires-python = ">=3.10"
license = { text = "MIT" }
# Versions verified on the dev machine 2026-10-27 (docs/ENVIRONMENT_REPORT.md).
dependencies = ["mujoco==3.17.0", "numpy==2.5.4", "scipy==1.18.1", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "xacro", "imageio"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
